<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热榜深潜简报</title>
<style>
  :root {
    --blue: #056de8;
    --orange: #ff8f1f;
    --ink: #1a1a1a;
    --muted: #86909c;
    --line: #e5e6eb;
    --paper: #ffffff;
    --page: #f2f3f5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.75;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }

  /* 报头 */
  header { border-bottom: 3px solid var(--ink); padding-bottom: 24px; }
  .kicker {
    font-size: 12px; letter-spacing: .18em; color: var(--blue);
    font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
  }
  h1 {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 32px; line-height: 1.2; font-weight: 700;
  }
  .slogan { color: var(--muted); font-size: 15px; margin-top: 8px; }

  /* 元信息行 */
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 16px 0; font-size: 13px; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .badge {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #fff; background: var(--blue);
  }
  .badge.fallback { background: var(--orange); }
  .badge.demo { background: #86909c; }

  /* 提示横幅 */
  .notice {
    margin-top: 16px; padding: 12px 16px; font-size: 13px;
    background: #fff7e8; border: 1px solid #ffd591; border-radius: 8px; color: #ad6800;
  }

  /* 卡片 */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; margin-top: 16px;
  }
  .card-head { display: flex; align-items: baseline; gap: 12px; }
  .rank {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 32px; font-weight: 700; color: var(--blue); line-height: 1;
    min-width: 36px; text-align: right;
  }
  .card-title { font-size: 17px; font-weight: 700; line-height: 1.5; }
  a.card-title { color: var(--ink); text-decoration: none; }
  a.card-title:hover { color: var(--blue); }
  .tag-demo {
    display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px;
    font-size: 11px; font-weight: 400; color: #86909c;
    border: 1px solid #c9cdd4; vertical-align: 2px;
  }
  .background { margin-top: 12px; font-size: 15px; color: #333; }
  .degrade-note {
    margin-top: 12px; padding: 8px 12px; font-size: 13px;
    color: var(--muted); background: #f7f8fa; border: 1px dashed var(--line); border-radius: 8px;
  }
  .degrade-note a { color: var(--blue); text-decoration: none; }
  .degrade-note a:hover { text-decoration: underline; }

  /* v2：type / claim 标签 */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tag {
    display: inline-block; padding: 1px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600; border: 1px solid transparent;
  }
  .tag.dispute { background: #fff4e8; color: #d25f00; border-color: #ffd8a8; }
  .tag.consensus { background: #e8ffea; color: #00801f; border-color: #aff0b5; }
  .tag.verify { background: #f0eaff; color: #5b34d6; border-color: #d6c8ff; }
  .tag.claim { background: #f7f8fa; color: #4e5969; border-color: #dcdfe5; font-weight: 500; }

  /* v2：聚焦问题 */
  .focus {
    margin-top: 14px; padding: 12px 14px; background: #f7f8fa;
    border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0;
    font-size: 15px; font-weight: 600; line-height: 1.7;
  }

  /* v2：共识底座 */
  .consensus-box {
    margin-top: 12px; padding: 12px 14px; background: #f0fff4;
    border: 1px solid #c6f0d0; border-radius: 8px; font-size: 14px; color: #1a4d28;
    line-height: 1.75;
  }
  .consensus-box b { color: #00801f; font-size: 12px; letter-spacing: .1em; display: block; margin-bottom: 4px; }

  /* v2：两派对照（替代原三列） */
  .sides { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
  .side { border-radius: 8px; padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }
  .side.a { background: #eef4ff; border: 1px solid #bed4ff; }
  .side.b { background: #fff4e8; border: 1px solid #ffd8a8; }
  .side b { display: block; font-size: 12px; letter-spacing: .1em; margin-bottom: 5px; }
  .side.a b { color: var(--blue); }
  .side.b b { color: #d25f00; }

  /* v2：缺的那块拼图 */
  .gap {
    margin-top: 12px; padding: 12px 14px; background: #fffbf0;
    border: 1px dashed #f0c060; border-radius: 8px; font-size: 14px; color: #7a5200;
    line-height: 1.75;
  }
  .gap b { color: #ad6800; font-size: 12px; letter-spacing: .1em; display: block; margin-bottom: 4px; }

  /* v2：今日洞察（深色卡） */
  .digest {
    margin-top: 24px; background: #0f1114; color: #e8eaed;
    border-radius: 14px; padding: 26px 26px 22px;
  }
  .digest h2 {
    font-size: 13px; letter-spacing: .16em; color: #7b61ff; font-weight: 700;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .digest .headline {
    font-size: 20px; line-height: 1.6; font-weight: 700; color: #fff;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }
  .digest .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 18px; }
  .digest .count-box { background: #1b1e23; border-radius: 10px; padding: 12px 14px; }
  .digest .count-box .n { font-size: 26px; font-weight: 700; line-height: 1.2; font-family: Georgia, serif; }
  .digest .count-box .l { font-size: 12px; color: #9aa0a6; margin-top: 2px; }
  .digest .count-box.dispute .n { color: #ff8f1f; }
  .digest .count-box.consensus .n { color: #3ddc84; }
  .digest .count-box.verify .n { color: #7b61ff; }
  .digest ul { list-style: none; border-top: 1px solid #2a2e35; padding-top: 16px; }
  .digest li {
    font-size: 14px; color: #c3c7cc; line-height: 1.8;
    padding-left: 18px; position: relative; margin-top: 10px;
  }
  .digest li:first-child { margin-top: 0; }
  .digest li::before { content: "▸"; position: absolute; left: 0; color: #7b61ff; }

  /* 延伸阅读 */
  .reading { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; list-style: none; }
  .reading li { margin-top: 8px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .reading li:first-child { margin-top: 0; }
  .reading a { color: var(--blue); text-decoration: none; }
  .reading a:hover { text-decoration: underline; }
  .reading .rt { color: var(--ink); font-weight: 600; }
  .reading .reason { color: var(--muted); font-size: 13px; }
  .reading .dead { color: #a9aeb8; }

  /* 页脚 */
  footer {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); line-height: 1.9;
  }

  /* 加载 / 出错 */
  .loading {
    max-width: 760px; margin: 15vh auto 0; padding: 0 20px;
    text-align: center; color: var(--muted); font-size: 15px;
  }
  .loading::before {
    content: ""; display: block; width: 28px; height: 28px; margin: 0 auto 16px;
    border: 3px solid #c9cdd4; border-top-color: var(--blue);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 48px; }
    h1 { font-size: 28px; }
    .sides { grid-template-columns: 1fr; }
    .digest { padding: 20px 18px 18px; }
    .digest .headline { font-size: 18px; }
    .digest .counts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="loading" class="loading">正在生成今日简报，首次访问约需 1–3 分钟，请稍候…</div>

<div id="app" class="wrap" hidden>
  <header>
    <div class="kicker">ZHIHU HOT DIGEST</div>
    <h1>热榜深潜简报</h1>
    <p class="slogan">10 分钟，看懂今天大家在吵什么。</p>
  </header>

  <div class="meta">
    <span id="badge" class="badge"></span>
    <span id="m-date"></span>
    <span id="m-count"></span>
    <span id="m-gen"></span>
  </div>

  <div id="notice" class="notice" hidden></div>
  <section id="digest" class="digest" hidden></section>
  <main id="cards"></main>

  <footer>
    <p>本工具基于知乎开放平台 API 构建 · AI 生成内容仅供参考</p>
    <p>参考与引用披露：本项目由 3 人大学生团队在 AI 辅助下完成开发；数据来自知乎开放平台 API（热榜 / 站内搜索 / 知乎直答），延伸阅读链接全部跳转回知乎站内；后端框架为 Flask（BSD-3-Clause 许可证）；页面视觉经开源 skill unslop（作者 Damir Sokolovsky，CC BY 4.0）辅助审查，特此署名。</p>
  </footer>
</div>

<!-- 数据入口：本地双击时读取本目录下的静态 data.js；部署后由 Flask 接管同名路由返回真实数据 -->
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var data = window.BRIEF_DATA;
  var loadingEl = document.getElementById('loading');

  function showError(msg) {
    loadingEl.textContent = msg;
    loadingEl.classList.remove('loading');
  }

  if (!data || !Array.isArray(data.items)) {
    showError('简报数据为空，请检查 data.js 是否正常加载。');
    return;
  }

  // demo（静态示例 / mock 模拟）模式下所有链接不可点，防止假链接被误点
  var isDemo = data.source === 'demo' || String(data.notice || '').indexOf('模拟数据') !== -1;

  var BADGES = {
    demo: '示例数据',
    live: '实时生成',
    cache: '当日缓存',
    fallback: '演示兜底'
  };

  // ---------- 元信息 ----------
  var badgeEl = document.getElementById('badge');
  badgeEl.textContent = BADGES[data.source] || data.source;
  if (data.source === 'fallback') badgeEl.classList.add('fallback');
  if (data.source === 'demo') badgeEl.classList.add('demo');
  document.getElementById('m-date').textContent = data.date || '';
  document.getElementById('m-count').textContent = '共 ' + data.items.length + ' 条';
  document.getElementById('m-gen').textContent = data.generated_at || '';

  if (data.notice) {
    var noticeEl = document.getElementById('notice');
    noticeEl.textContent = data.notice;
    noticeEl.hidden = false;
  }

  // ---------- 渲染 ----------
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function demoTag() {
    return el('span', 'tag-demo', '示例');
  }

  function renderTitle(item) {
    var box = el('div', 'card-title-box');
    box.style.flex = '1';
    var titleNode;
    if (isDemo || !item.question_url) {
      titleNode = el('span', 'card-title', item.title);
      titleNode.appendChild(demoTag());
    } else {
      titleNode = el('a', 'card-title', item.title);
      titleNode.href = item.question_url;
      titleNode.target = '_blank';
      titleNode.rel = 'noopener';
    }
    box.appendChild(titleNode);
    return box;
  }

  function renderReading(list) {
    var ul = el('ul', 'reading');
    (list || []).forEach(function (r) {
      var li = el('li');
      if (isDemo || !r.url) {
        var dead = el('span', 'rt dead', r.title);
        dead.appendChild(demoTag());
        li.appendChild(dead);
      } else {
        var a = el('a', 'rt', r.title);
        a.href = r.url;
        a.target = '_blank';
        a.rel = 'noopener';
        li.appendChild(a);
      }
      if (r.reason) li.appendChild(el('span', 'reason', '—— ' + r.reason));
      ul.appendChild(li);
    });
    return ul;
  }

  // ---- v2：今日洞察 ----
  (function renderDigest() {
    var d = data.digest;
    if (!d) return;
    var box = document.getElementById('digest');
    if (!box) return;
    box.appendChild(el('h2', '', "TODAY'S INSIGHT"));
    box.appendChild(el('p', 'headline', d.headline));

    var counts = el('div', 'counts');
    [['dispute', d.dispute, '条真分歧'],
     ['consensus', d.consensus, '条已共识'],
     ['verify', d.verify, '条待验证']].forEach(function (c) {
      var cell = el('div', 'count-box ' + c[0]);
      cell.appendChild(el('div', 'n', String(c[1])));
      cell.appendChild(el('div', 'l', c[2]));
      counts.appendChild(cell);
    });
    box.appendChild(counts);

    var ul = el('ul');
    (d.insights || []).forEach(function (t) { ul.appendChild(el('li', '', t)); });
    box.appendChild(ul);
    box.hidden = false;
  })();

  var cardsEl = document.getElementById('cards');
  data.items.forEach(function (item) {
    var card = el('article', 'card');

    var head = el('div', 'card-head');
    head.appendChild(el('span', 'rank', String(item.rank)));
    head.appendChild(renderTitle(item));
    card.appendChild(head);

    if (item.background === '暂无解读。' && item.question_url && !isDemo) {
      var note = el('p', 'degrade-note');
      note.appendChild(document.createTextNode('该条解读生成失败，'));
      var go = el('a', '', '点击标题直达知乎原问题');
      go.href = item.question_url;
      go.target = '_blank';
      go.rel = 'noopener';
      note.appendChild(go);
      note.appendChild(document.createTextNode('参与讨论。'));
      card.appendChild(note);
    } else if (item.background) {
      card.appendChild(el('p', 'background', item.background));
    }

    // ---- v2：按 type 分派渲染 ----
    var TYPE_LABEL = { dispute: '有真分歧', consensus: '已形成共识', verify: '待验证' };
    var CLAIM_LABEL = { fact: '可裁决', inference: '推测对推测', impression: '观感对观感', value: '价值判断' };

    if (item.type) {
      var tags = el('div', 'tags');
      tags.appendChild(el('span', 'tag ' + item.type, TYPE_LABEL[item.type] || item.type));
      if (item.claim_type) {
        tags.appendChild(el('span', 'tag claim',
          '分歧性质：' + (CLAIM_LABEL[item.claim_type] || item.claim_type)));
      }
      card.appendChild(tags);

      if (item.focus) {
        card.appendChild(el('div', 'focus', item.focus));
      }

      if (item.consensus) {
        var cb = el('div', 'consensus-box');
        cb.appendChild(el('b', '', '共识'));
        cb.appendChild(document.createTextNode(item.consensus));
        card.appendChild(cb);
      }

      if (item.sides && item.sides.length === 2) {
        var sidesGrid = el('div', 'sides');
        item.sides.forEach(function (s, i) {
          var box = el('div', 'side ' + (i === 0 ? 'a' : 'b'));
          box.appendChild(el('b', '', s.label));
          box.appendChild(document.createTextNode(s.claim));
          sidesGrid.appendChild(box);
        });
        card.appendChild(sidesGrid);
      }

      if (item.gap) {
        var gapBox = el('div', 'gap');
        gapBox.appendChild(el('b', '', '缺的那块拼图'));
        gapBox.appendChild(document.createTextNode(item.gap));
        card.appendChild(gapBox);
      }
    } else {
      // 兼容：旧缓存没有 type 字段，退回三派渲染
      var vp = item.viewpoints || {};
      var grid = el('div', 'viewpoints');
      [['support', 'vp support', '支持'], ['oppose', 'vp oppose', '反对'], ['undecided', 'vp undecided', '未定论']]
        .forEach(function (cfg) {
          var block = el('div', cfg[1]);
          block.appendChild(el('b', '', cfg[2]));
          block.appendChild(document.createTextNode(vp[cfg[0]] || ''));
          grid.appendChild(block);
        });
      card.appendChild(grid);
    }

    if (item.reading && item.reading.length) {
      card.appendChild(renderReading(item.reading));
    }

    cardsEl.appendChild(card);
  });

  loadingEl.remove();
  document.getElementById('app').hidden = false;
})();
</script>
</body>
</html>
