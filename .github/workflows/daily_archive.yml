name: Daily hot topic archive

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Build daily archive and timeline
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE: ${{ secrets.MODEL_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          python scripts/daily_archive.py
          python scripts/build_timeline.py
      - name: Commit and push archive updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/ data/topic_timeline.json demo/timeline.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(archive): daily hot digest archive $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin main
          fi
