name: Daily hot topic archive

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Build daily archive and timeline
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE: ${{ secrets.MODEL_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          GEN_BUDGET_SECONDS: "240"
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "归档目标日期（北京时间）：${TODAY}"
          if [ ! -f "data/brief_${TODAY}.json" ] && [ -z "${ZHIHU_ACCESS_SECRET}" ]; then
            echo "拒绝归档：当日 data/brief_${TODAY}.json 不存在且未配置 ZHIHU_ACCESS_SECRET"
            echo "请在 GitHub Actions Secrets 中配置 ZHIHU_ACCESS_SECRET 后重试"
            exit 1
          fi
          python scripts/daily_archive.py --update-fallback
          python scripts/build_timeline.py --with-related-past
      - name: Commit and push archive updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/archive data/topic_timeline.json demo/timeline.js data/fallback.json demo/data.js; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(archive): daily hot digest archive $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          else
            echo "无归档变更，跳过提交"
          fi
